name: Nightly Build

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to check for recent commits

      - name: Check for recent commits
        id: check_commits
        run: |
          # Check if there were commits in the last 24 hours
          COMMITS=$(git log --oneline --since="24 hours ago" | wc -l)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          if [ "$COMMITS" -eq 0 ]; then
            echo "No commits in the last 24 hours, skipping build"
          else
            echo "Found $COMMITS commit(s) in the last 24 hours"
          fi

      - name: Set up Python
        if: steps.check_commits.outputs.commits != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        if: steps.check_commits.outputs.commits != '0'
        run: python run_tests.py

      - name: Build nightly release
        if: steps.check_commits.outputs.commits != '0'
        run: python make_release.py --nightly

      - name: Upload to nightly release
        if: steps.check_commits.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing nightly release if it exists
          gh release delete nightly --yes || true
          git push origin :refs/tags/nightly || true
          # Create new nightly release
          gh release create nightly releases/*.zip \
            --title "Nightly Build" \
            --notes "Automated nightly build from $(date -u +%Y-%m-%d)" \
            --prerelease
